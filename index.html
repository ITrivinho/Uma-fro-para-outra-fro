<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Frô para Tu</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Uma frô para outra frô 🌹</h1>
    <p>Essa florzinha precisa de um pouco de carinho...</p>

    <div id="flower-container">
        <div class="pot"></div>
        <div class="stem"></div>
        <div class="leaf leaf-right"></div>
        <div class="leaf leaf-left"></div>
        <div class="flower-head">
            <div class="petal petal-top"></div>
            <div class="petal petal-bottom"></div>
            <div class="petal petal-left"></div>
            <div class="petal petal-right"></div>
            <div class="flower-center"></div>
        </div>
    </div>

    <button id="water-button">Regar a frô</button>
    <p id="secret-message"></p>
</body>
</html>
